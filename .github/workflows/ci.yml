name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Style and types are version-independent, so they run once on their
  # own rather than six times inside the matrix below.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating v10 tag, so this is pinned exactly.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - run: uv sync --all-groups
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync mypy src

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Django 5.2 supports Python 3.10-3.13; 6.0 and 6.1 support
        # 3.12-3.14. 5.2 and 6.1 are pinned at both ends of their own
        # Python ranges, and every supported Python appears at least
        # once. 6.0 is covered only at its floor: 3.14 x 6.1 already
        # exercises the upper end of the same interpreter range.
        include:
          - python: "3.10"
            django: "5.2"
          - python: "3.11"
            django: "5.2"
          - python: "3.13"
            django: "5.2"
          - python: "3.12"
            django: "6.0"
          - python: "3.12"
            django: "6.1"
          - python: "3.14"
            django: "6.1"
    env:
      # uv reads this and provisions the interpreter itself. Without it
      # the matrix's python axis is inert: every job would run on
      # whatever interpreter happens to satisfy requires-python.
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Install
        run: |
          uv sync --all-groups
          uv pip install "django~=${{ matrix.django }}.0"

      # Coverage is measured on every cell, not one: the suite reaches
      # 100% on all six, so a branch that only one interpreter takes
      # would show up as a drop rather than hide behind an average.
      # fail_under lives in pyproject.toml.
      - name: Test with coverage
        run: >-
          uv run --no-sync pytest -v
          --cov=django_sqlcommenter --cov-branch --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.python == '3.13' && matrix.django == '5.2'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
